# GitHub Actions 自动部署：push 到 main 分支后构建并发布到 GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

# Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 拉取代码
      - name: Checkout
        uses: actions/checkout@v4
      # 安装 Node.js 22（与 package.json engines 要求一致）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 安装依赖（npm ci 严格按 package-lock.json 安装）
      - name: Install dependencies
        run: npm ci
      # 构建生产包
      - name: Build
        run: npm run build
      # SPA 兜底：GitHub Pages 将 404.html 作为自定义 404 页，
      # 复制 index.html 后 History 模式路由刷新子路径也能正常访问
      - name: SPA fallback (copy index.html to 404.html)
        run: cp dist/index.html dist/404.html
      # 上传构建产物
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
